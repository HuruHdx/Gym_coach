<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gym Coach · 设置</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#F2F3EE; --bg-elevated:#FFFFFF; --ink:#12140F; --ink-muted:#6B7164;
  --line:#D8DBD0; --accent:#C8F000; --accent-ink:#1A2200;
  --danger:#E23D2D; --ok:#2F6B3A;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
  --font-display:"Syne",system-ui,sans-serif;
  --font-body:"Public Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-body);background:#1a1c18;color:var(--ink);display:grid;place-items:center;min-height:100%;padding:24px 12px}
.stage{
  width:min(390px,100%);height:min(844px,94vh);
  background:var(--bg);border-radius:28px;overflow:hidden;position:relative;
  box-shadow:0 30px 80px rgba(0,0,0,.45);
  display:flex;flex-direction:column;isolation:isolate;
}
.stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  z-index:0;
}
.screen{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-height:0}

.status{display:flex;justify-content:space-between;padding:12px 20px 4px;font-size:12px;font-weight:600}
.topbar{padding:8px 12px 12px;display:flex;justify-content:space-between;align-items:center}
.back-btn{border:1px solid var(--line);background:var(--bg-elevated);width:36px;height:36px;border-radius:var(--radius-sm);display:grid;place-items:center;cursor:pointer;color:var(--ink);font-size:18px}
.page-title{font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.topbar .spacer{width:36px}

.scroll{flex:1;overflow-y:auto;padding:0 16px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

.section-title{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin:16px 4px 8px}
.card{background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--radius-md);padding:4px 14px;margin-bottom:8px}

.set-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;
}
.set-row:last-child{border-bottom:none}
.set-row .k{font-size:14px;font-weight:600}
.set-row .k small{display:block;font-size:11px;font-weight:500;color:var(--ink-muted);margin-top:2px}
.set-row .val{font-size:13px;color:var(--ink-muted);display:flex;align-items:center;gap:6px}
.set-row .val.danger{color:var(--danger)}

/* toggle */
.toggle{
  width:44px;height:26px;border-radius:13px;background:var(--accent);
  position:relative;cursor:pointer;border:none;flex-shrink:0;
}
.toggle::after{
  content:"";position:absolute;top:3px;right:3px;
  width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.toggle.off{background:var(--line)}
.toggle.off::after{right:auto;left:3px}

.chev{color:var(--ink-muted);font-size:14px}

/* version */
.about{
  text-align:center;padding:20px 0 8px;
}
.about .logo{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.03em}
.about .logo span{color:var(--accent)}
.about .ver{font-size:12px;color:var(--ink-muted);margin-top:4px}

.danger-btn{
  width:100%;border:1px solid var(--danger);background:transparent;color:var(--danger);
  font-size:14px;font-weight:700;padding:14px;border-radius:var(--radius-md);cursor:pointer;margin-top:16px;
}
</style>
</head>
<body>
<div class="stage">
  <div class="screen">
    <div class="status"><span>9:41</span><span>5G</span></div>

    <div class="topbar">
      <button class="back-btn">←</button>
      <div class="page-title">设置</div>
      <div class="spacer"></div>
    </div>

    <div class="scroll">
      <!-- 数据 -->
      <div class="section-title">数据</div>
      <div class="card">
        <div class="set-row">
          <div class="k">导出数据<small>训练记录 + 体重历史</small></div>
          <div class="val">CSV <span class="chev">›</span></div>
        </div>
        <div class="set-row">
          <div class="k">重置全部数据<small>清空记录，重新填写资料</small></div>
          <div class="val danger"><span class="chev">›</span></div>
        </div>
      </div>

      <!-- 关于 -->
      <div class="section-title">关于</div>
      <div class="card">
        <div class="set-row">
          <div class="k">隐私说明</div>
          <div class="val"><span class="chev">›</span></div>
        </div>
        <div class="set-row">
          <div class="k">版本</div>
          <div class="val">0.1.0</div>
        </div>
      </div>

      <div class="about">
        <div class="logo">Gym Coach<span>.</span></div>
        <div class="ver">v0.1.0 · 数据仅存本地</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gym Coach · 我的 v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#F2F3EE; --bg-elevated:#FFFFFF; --ink:#12140F; --ink-muted:#6B7164;
  --line:#D8DBD0; --accent:#C8F000; --accent-ink:#1A2200;
  --danger:#E23D2D; --ok:#2F6B3A;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
  --shadow:0 12px 40px rgba(18,20,15,.12);
  --font-display:"Syne",system-ui,sans-serif;
  --font-body:"Public Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-body);background:#1a1c18;color:var(--ink);
  display:grid;place-items:center;min-height:100%;padding:24px 12px;
}
.stage{
  width:min(390px,100%);height:min(844px,94vh);
  background:var(--bg);border-radius:28px;overflow:hidden;position:relative;
  box-shadow:0 30px 80px rgba(0,0,0,.45);
  display:flex;flex-direction:column;isolation:isolate;
}
.stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  z-index:0;
}
.screen{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-height:0}

.status{display:flex;justify-content:space-between;padding:12px 20px 4px;font-size:12px;font-weight:600}
.topbar{
  padding:8px 16px 12px;display:flex;justify-content:space-between;align-items:center;
}
.brand{font-family:var(--font-display);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.icon-btn{
  width:34px;height:34px;border:1px solid var(--line);background:var(--bg-elevated);
  border-radius:var(--radius-sm);display:grid;place-items:center;cursor:pointer;color:var(--ink);
}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.scroll{flex:1;overflow-y:auto;padding:0 16px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* ===== 1. 头像区 ===== */
.hero{
  display:flex;align-items:center;gap:14px;padding:8px 0 18px;
}
.avatar{
  width:64px;height:64px;border-radius:18px;background:var(--ink);color:var(--accent);
  display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:26px;flex-shrink:0;
}
.hero-who{flex:1;min-width:0}
.hero-name{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.hero-tag{font-size:12px;color:var(--ink-muted);margin-top:3px}
.edit-btn{
  border:1px solid var(--line);background:var(--bg-elevated);
  padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;
  color:var(--ink);cursor:pointer;
}

/* ===== 2. 三个大数字 ===== */
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;
}
.stat{
  background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:14px 10px;text-align:center;
}
.stat .num{
  font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-.03em;line-height:1;
}
.stat .num small{font-size:12px;font-weight:600;color:var(--ink-muted);margin-left:2px}
.stat .label{font-size:11px;color:var(--ink-muted);margin-top:6px;font-weight:600}
.stat.accent{background:var(--ink);border-color:var(--ink)}
.stat.accent .num{color:var(--accent)}
.stat.accent .label{color:rgba(242,243,238,.6)}

/* ===== 3. AI 洞察（深色卡） ===== */
.insight{
  background:var(--ink);color:#f2f3ee;border-radius:var(--radius-lg);
  padding:16px;margin-bottom:14px;position:relative;overflow:hidden;cursor:pointer;
}
.insight::before{
  content:"";position:absolute;right:-30px;bottom:-40px;width:160px;height:160px;
  background:var(--accent);opacity:.85;clip-path:polygon(30% 0,100% 0,100% 100%,0 70%);
}
.insight .kicker{
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  opacity:.65;display:flex;align-items:center;gap:6px;
}
.insight h3{
  font-family:var(--font-display);font-size:18px;font-weight:800;
  margin:10px 0 6px;line-height:1.3;position:relative;
}
.insight p{position:relative;font-size:13px;line-height:1.5;opacity:.8;max-width:28ch}
.insight-todo{
  margin-top:14px;padding-top:12px;border-top:1px solid rgba(242,243,238,.15);
  display:flex;align-items:center;gap:10px;position:relative;
}
.insight-todo .t-icon{
  width:28px;height:28px;border-radius:8px;background:rgba(242,243,238,.1);
  display:grid;place-items:center;flex-shrink:0;
}
.insight-todo .t-icon svg{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.insight-todo .t-text{flex:1;font-size:12px;opacity:.85}
.insight-todo .t-btn{
  background:var(--accent);color:var(--accent-ink);border:none;
  padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700;cursor:pointer;
}

/* ===== 4. 体重趋势 ===== */
.card{
  background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:16px;margin-bottom:14px;
}
.weight-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.weight-head .tt{font-size:12px;font-weight:700;color:var(--ink-muted)}
.weight-head .delta{font-size:12px;font-weight:700;color:var(--ok)}
.weight-big{
  font-family:var(--font-display);font-weight:800;font-size:42px;letter-spacing:-.04em;line-height:1;
}
.weight-big small{font-size:14px;font-weight:600;color:var(--ink-muted);margin-left:4px}
.weight-sub{font-size:11px;color:var(--ink-muted);margin-top:6px}
.spark{margin-top:14px}
.spark svg{width:100%;height:70px;display:block}

/* ===== 5. 底部营养入口 ===== */
.nutrition{
  background:var(--bg-elevated);border:1px dashed var(--line);border-radius:var(--radius-md);
  padding:14px;text-align:center;margin-bottom:16px;opacity:.5;
}
.nutrition .n-icon{font-size:18px;margin-bottom:4px}
.nutrition .n-text{font-size:12px;font-weight:600;color:var(--ink-muted)}

/* ===== AI 洞察详情 sheet ===== */
.overlay{
  position:absolute;inset:0;background:rgba(18,20,15,.35);
  z-index:10;opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:11;
  background:var(--bg);border-radius:18px 18px 0 0;
  box-shadow:var(--shadow);max-height:85%;
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;overflow:hidden;
}
.sheet.show{transform:translateY(0)}
.sheet-handle{
  width:36px;height:4px;background:var(--line);border-radius:2px;
  margin:10px auto 4px;flex-shrink:0;
}
.sheet-head{
  padding:8px 20px 12px;display:flex;justify-content:space-between;align-items:center;
}
.sheet-head h2{font-family:var(--font-display);font-size:20px;font-weight:700}
.sheet-head .close{
  border:1px solid var(--line);background:var(--bg-elevated);
  width:32px;height:32px;border-radius:var(--radius-sm);cursor:pointer;font-size:16px;color:var(--ink);
}
.sheet-body{padding:0 16px 24px;overflow-y:auto;flex:1}

.insight-section{margin-bottom:18px}
.insight-section .sec-title{
  font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-muted);margin-bottom:8px;
}
.insight-card{
  background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:14px;margin-bottom:8px;
}
.insight-card .row{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:6px 0;border-bottom:1px solid var(--line);
}
.insight-card .row:last-child{border-bottom:none}
.insight-card .row .k{font-size:13px;color:var(--ink-muted)}
.insight-card .row .v{font-family:var(--font-display);font-weight:700;font-size:14px}
.insight-card .row .v small{font-size:11px;color:var(--ink-muted);font-weight:600;margin-left:2px}

.constraint-row{
  display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);
}
.constraint-row:last-child{border-bottom:none}
.c-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.c-dot.hard{background:var(--danger)}
.c-dot.cool{background:var(--ink-muted)}
.c-dot.recovery{background:var(--accent)}
.c-body{flex:1;font-size:13px;line-height:1.4}
.c-body b{font-weight:700}
.c-body span{color:var(--ink-muted);font-size:11px;display:block;margin-top:2px}

/* tabs */
.dock{
  position:absolute;left:0;right:0;bottom:0;z-index:5;
  background:linear-gradient(to top,var(--bg) 70%,transparent);
  padding:8px 12px calc(10px + env(safe-area-inset-bottom));
}
.tabs{
  display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--bg-elevated);border:1px solid var(--line);
  border-radius:var(--radius-md);overflow:hidden;
}
.tab{
  border:none;background:transparent;padding:12px 4px 10px;cursor:pointer;
  font-family:var(--font-body);font-size:12px;font-weight:600;color:var(--ink-muted);position:relative;
}
.tab.active{color:var(--ink)}
.tab.active::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:28px;height:2px;background:var(--accent);
}
</style>
</head>
<body>
<div class="stage">
  <div class="screen">
    <div class="status"><span>9:41</span><span>5G</span></div>

    <div class="topbar">
      <div class="brand">Gym Coach</div>
    </div>

    <div class="scroll">
      <!-- 1. 头像 -->
      <div class="hero">
        <div class="avatar">H</div>
        <div class="hero-who">
          <div class="hero-name">Huru</div>
          <div class="hero-tag">增肌 · 进阶 · 每周 4 练</div>
        </div>
        <button class="edit-btn">编辑</button>
      </div>

      <!-- 2. 三个大数字 -->
      <div class="stats">
        <div class="stat">
          <div class="num">3<small>次</small></div>
          <div class="label">本周训练</div>
        </div>
        <div class="stat accent">
          <div class="num">32.5<small>kg</small></div>
          <div class="label">卧推 PR</div>
        </div>
        <div class="stat">
          <div class="num">72.4<small>kg</small></div>
          <div class="label">当前体重</div>
        </div>
      </div>

      <!-- 3. AI 洞察 -->
      <div class="insight">
        <div class="kicker">◆ AI 洞察</div>
        <h3>本周卧推 30 → 32.5kg</h3>
        <p>左膝已自动避开箭步蹲等 2 个动作，平板卧推冷却中（12/14 天）。</p>
        <div class="insight-todo">
          <div class="t-icon">
            <svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
          </div>
          <div class="t-text">上次体重记录是 3 天前</div>
          <button class="t-btn">记体重</button>
        </div>
      </div>

      <!-- 4. 体重趋势 -->
      <div class="card">
        <div class="weight-head">
          <div class="tt">体重趋势</div>
          <div class="delta">↓ 0.3 kg vs 上次</div>
        </div>
        <div class="weight-big">72.4<small>kg</small></div>
        <div class="weight-sub">近 8 次记录 · 目标 70.0</div>
        <div class="spark">
          <svg viewBox="0 0 340 70" preserveAspectRatio="none">
            <line x1="0" y1="18" x2="340" y2="18" stroke="#D8DBD0" stroke-width="1" stroke-dasharray="3 4"/>
            <line x1="0" y1="48" x2="340" y2="48" stroke="#D8DBD0" stroke-width="1" stroke-dasharray="3 4"/>
            <polyline points="10,14 55,19 100,23 145,28 190,33 235,40 280,50 330,58"
                      fill="none" stroke="#12140F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
            <circle cx="330" cy="58" r="6" fill="#C8F000" stroke="#12140F" stroke-width="2.5"/>
            <circle cx="10" cy="14" r="3.5" fill="#12140F"/>
          </svg>
        </div>
      </div>

      <!-- 5. 营养入口（灰化） -->
      <div class="nutrition">
        <div class="n-icon">🍽</div>
        <div class="n-text">营养饮食 · 即将上线</div>
      </div>
    </div>

    <!-- tabs -->
    <div class="dock">
      <div class="tabs">
        <button class="tab">今日</button>
        <button class="tab">训练</button>
        <button class="tab active">我的</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>

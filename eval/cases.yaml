  vars: {question: "引体向上怎么练"}
  assert:
    - type: javascript
      value: file://assertions/text.js
      config: {max_chars: 500}

- description: "B05 老炮画像：不把档位当称呼"
  tags: [boundary, guard]
  vars:
    question: "深蹲怎么练"
    profile: {goal: "增肌", experience: "老炮", weight_kg: 72, days_per_week: 4, injuries: []}
  assert:
    - type: javascript
      value: file://assertions/text.js
      config: {not_contains: ["老炮", "新手", "进阶"], max_chars: 500}

- description: "B06 一句问三件事：练哪里、怎么做、一周几次"
  tags: [boundary, p0]
  vars: {question: "深蹲练哪里、怎么做、一周练几次"}
  assert:
    - type: llm-rubric
      value: "用户一句问了三件事（目标肌、做法、频率）。是否至少回答了其中两件、且没有把三件事混成一段空话？只答一件给 0.4 以下。判定不合格时，必须给出原因：第一行写归因标签（只能取：数据缺漏|内容遗漏|内容错误|长度|格式|其它），第二行写一句具体问题（漏了哪条标准/多了什么/哪里错）。"
      threshold: 0.7
  repeat: 3

- description: "B07 只发一个问号"
  tags: [boundary]
  vars: {question: "？"}
  assert:
    - type: javascript
      value: file://assertions/text.js
      config: {max_chars: 500, forbid_json: true}

- description: "B08 中英混：卧推 bench press 练哪里"
  tags: [boundary]
  vars: {question: "卧推 bench press 练哪里"}
  assert:
    - type: javascript
      value: file://assertions/text.js
      config: {contains: ["胸大肌"], max_chars: 500}

# ══ R 非问答（5）════════════════════════════════════════════════════════
- description: "R01 今天练背（排课，不许答成知识）"
  tags: [route, p0]
  vars: {question: "今天练背"}
  assert:
    - type: javascript
      value: file://assertions/branch.js
      config: {route: plan, search_called: false}
    - type: javascript
      value: file://assertions/text.js
      config: {max_chars: 500}

- description: "R02 把坐姿划船换掉（有草稿 → 改稿）"
  tags: [route, draft]
  vars:
    question: "把坐姿划船换掉"
    draft_title: "背训"
    draft_items:
      - {id: c1, title: 高位下拉, selected: true, meta: {sets: 3, reps: "8-10", muscle: 背}}
      - {id: c2, title: 坐姿划船, selected: true, meta: {sets: 3, reps: "10-12", muscle: 背}}
  assert:
    - type: javascript
      value: file://assertions/branch.js
      config: {route: plan}

- description: "R03 就这个吧（口头采纳）"
  tags: [route, adopt]
  vars:
    question: "就这个吧，今天的计划"
    draft_title: "背训"
    draft_items:
      - {id: c1, title: 高位下拉, selected: true, meta: {sets: 3, reps: "8-10", muscle: 背}}
  assert:
    - type: javascript
      value: file://assertions/text.js
      config: {contains: ["采纳"], max_chars: 500}

- description: "R04 今天心情不好，不想练（闲聊不越界）"
  tags: [route, chitchat, p0]
  vars: {question: "今天心情不好，不想练"}
  assert:
    - type: javascript
      value: file://assertions/branch.js
      config: {search_called: false}
    - type: llm-rubric
      value: |
        1. 先接住情绪，不说教、不硬劝；
        2. 可以轻推一句或给一个轻量选项（休息/散步/拉伸/空手深蹲），但不排成套计划——不出现「深蹲/卧推/划船，每个做 N 组」这种动作+组数+重量的安排；
        3. 不追问「练什么部位」，不要求必须练。
        判定不合格时，必须给出原因：第一行写归因标签（只能取：数据缺漏|内容遗漏|内容错误|长度|格式|其它），第二行写一句具体问题（漏了哪条标准/多了什么/哪里错）。
      threshold: 0.7
  repeat: 3

- description: "R05 今天吃什么蛋白粉（知识，不是营养占位）"
  tags: [route, nutrition]
  vars: {question: "今天吃什么蛋白粉"}
  assert:
    - type: javascript
      value: file://assertions/text.js
      config: {not_contains: ["营养师还没上线"], max_chars: 500}
    - type: llm-rubric
      value: |
        1. 正面回答「吃什么蛋白粉」，给一个能直接照做的建议（类型/怎么喝/一次多少）；
           点名具体品牌可以，但要说明是「常见选择」，不能说成评测结论；
        2. 不编产品参数（每勺蛋白克数、成分表、价格、批次），不确定就说「以包装为准」；
        3. 不做绝对化或贬低性比较（「最好」「别买 X」）；
        4. 不出现「营养师还没上线」这类占位。
        判定不合格时，必须给出原因：第一行写归因标签（只能取：数据缺漏|内容遗漏|内容错误|长度|格式|其它），第二行写一句具体问题（漏了哪条标准/多了什么/哪里错）。
      threshold: 0.7
  repeat: 3

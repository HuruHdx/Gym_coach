# ══ A 建议（7）══════════════════════════════════════════════════════════
- description: "A01 明天练胸还是练背好（无上下文）"
  tags: [advice, p0]
  vars: {question: "明天练胸还是练背好"}
  assert:
    # 允许「都行，关键看…」：只要后面给出倾向或判断条件，就算给了建议。
    - type: javascript
      value: file://assertions/text.js
      config: {max_chars: 500}
    - type: llm-rubric
      value: |
        评分 0-1：用户在问明天练胸还是练背，没有给任何上下文。
        1. 给了一个明确倾向，或一条明确的判断条件（例如「背还酸就练胸，否则练背」）；
        2. 依据落在恢复间隔 / 每周频次 / 部位搭配这类实际信息上；
        3. 可以顺带说通用容量，但不排成一堂课（不出现成套的动作+组数+重量）。
        只说「都行」「看你自己」、没有任何倾向或条件的，0.3 以下。
        判定不合格时，必须给出原因：第一行写归因标签（只能取：数据缺漏|内容遗漏|内容错误|长度|格式|其它），第二行写一句具体问题（漏了哪条标准/多了什么/哪里错）。
      threshold: 0.7
  repeat: 3

- description: "A01b 昨天练了胸，明天练什么（应结合上下文）"
  tags: [advice, p0, context]
  vars:
    question: "明天练胸还是练背好"
    history:
      - {role: user, text: "昨天练了胸，今天还有点酸"}
      - {role: assistant, text: "那今天让胸恢复一下。"}
  assert:
    - type: llm-rubric
      value: |
        1. 用到了「昨天练了胸、还在酸」这条上下文；
        2. 结论倾向背（或明确解释为什么仍练胸，例如昨天没练到位）；
        3. 理由落到胸的恢复间隔，不是通用规则。
        判定不合格时，必须给出原因：第一行写归因标签（只能取：数据缺漏|内容遗漏|内容错误|长度|格式|其它），第二行写一句具体问题（漏了哪条标准/多了什么/哪里错）。

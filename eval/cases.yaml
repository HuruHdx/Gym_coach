- description: "F09 史密斯坐姿划船练哪里（库里没有这个正式名）"
  tags: [fact, p0]
  vars: {question: "史密斯坐姿划船练哪里"}
  assert:
    # 反问是允许的（评测架构需求 3b）：候选里出现「提踵」本身不算违规，
    # 违规的是「只有一个跨部位候选」或「把提踵当成答案」——交给 rubric 判。
    - type: javascript
      value: file://assertions/text.js
      config: {max_chars: 500}
    - type: llm-rubric
      value: |
        评分 0-1：用户问「史密斯坐姿划船」，这不是库里的正式名（史密斯划船/史密斯杠铃划船一般指史密斯机俯身划船那一类）。
        1. 两种做法都算对：直接说明「这个说法一般指史密斯机俯身/支撑类划船」，或者反问确认；
        2. 如果反问，候选必须是划船类动作（史密斯机俯身划船/窄距划船/单臂划船/胸部支撑俯身划船），各种叫法都算；
        3. 答到练背（背阔肌/上背/背部，措辞不限）；
        4. 不许把提踵/小腿当成这个动作的答案；候选里只有提踵这种跨部位动作的，判不合格；
        5. 不编造器械参数。
        判定不合格时，必须给出原因：第一行写归因标签（只能取：数据缺漏|内容遗漏|内容错误|长度|格式|其它），第二行写一句具体问题（漏了哪条标准/多了什么/哪里错）。
      threshold: 0.7
  repeat: 3


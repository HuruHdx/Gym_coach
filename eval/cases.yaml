# 整体评测（端到端）· 2026-10-27
#
# 一句话进去，看整体回答对不对。不再按「分支层 / 目标态 / 回答层」拆套件。
# 意图层单独保留（cases-intent.yaml）：它是回归门禁，不是这份评测的一部分。
#
# 每条用例断言三件事里的 1~3 件：
#   ① 内容：必须出现/不能出现/多长/中文      → assertions/text.js
#   ② 依据：引用了哪条、数字是否等于工具返回值 → assertions/cites.js / stats.js
#   ③ 行为：有没有误进排课、闲聊有没有搜网     → assertions/branch.js
#
# 标签：
#   p0        核心
#   known_gap 代码还没改好，现在应该红（不是评测写错）
#   blocked   需要接口补字段才能跑（stats_fixture）
#
#   cd api && uv run uvicorn app.main:app --port 8000
#   cd eval && npx promptfoo eval --no-cache


      config: {topic: qa}

# ── chitchat（5）：既不要安排也不要知识 ───────────────────────────────────
- description: "I26 寒暄"
  tags: [intent, chitchat]
  vars:
    question: "你好"
  assert:
    - type: javascript
      value: file://assertions/topic.js
      config: {topic: chitchat}

- description: "I27 情绪"
  tags: [intent, chitchat]
  vars:
    question: "今天好累啊"
  assert:
    - type: javascript
      value: file://assertions/topic.js
      config: {topic: chitchat}

- description: "I28 不想练（不是 plan）"
  tags: [intent, chitchat, boundary, p0]
  vars:
    question: "今天心情不好，不想练"
  assert:
    - type: javascript
      value: file://assertions/topic.js
      config: {topic: chitchat}

- description: "I29 道谢"
  tags: [intent, chitchat]
  vars:
    question: "谢谢"
  assert:
    - type: javascript
      value: file://assertions/topic.js
      config: {topic: chitchat}

- description: "I32 短回复（没有指代对象）"
  tags: [intent, chitchat, short_reply]
  vars:
    question: "嗯嗯"
  assert:
    - type: javascript
      value: file://assertions/topic.js
      config: {topic: chitchat}

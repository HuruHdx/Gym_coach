- description: "I24 本月次数（同上）"
  tags: [intent, qa, data]
  vars:
    question: "我这个月练了几次"
  assert:
    - type: javascript
      value: file://assertions/topic.js
      config: {topic: qa}

- description: "I25 档案字段（画像已注入）"
  tags: [intent, qa, data]
  vars:
    question: "我体重多少"
  assert:
    - type: javascript
      value: file://assertions/topic.js
      config: {topic: qa}

- description: "I34 吃的问题（营养知识，不是排课、也不是营养占位）"
  tags: [intent, qa, nutrition, p0]
  vars:
    question: "今天吃什么蛋白粉"
  assert:
    - type: javascript
